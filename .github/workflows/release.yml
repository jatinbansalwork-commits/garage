name: Release

on:
  push:
    tags: ["garage-ui@*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Don't set registry-url here — setup-node would write a placeholder
      # NODE_AUTH_TOKEN into ~/.npmrc and break OIDC trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/garage-ui/package.json').version")
          if [ "garage-ui@$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1
          fi
      - name: Install site dependencies (the package builds from the site's source)
        run: npm ci
      - name: Install package dependencies
        run: npm ci
        working-directory: packages/garage-ui
      - name: Publish to npm
        working-directory: packages/garage-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
            npm publish --access public
          else
            echo "No NPM_TOKEN — publishing with GitHub OIDC trusted publisher (--provenance)"
            npm publish --access public --provenance
          fi
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
